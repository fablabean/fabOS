services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    cloudflared:
        image: 'cloudflare/cloudflared:latest'
        # Perfil aparte: solo sube cuando se pide explicitamente con
        #   docker compose --profile tunel up -d
        profiles: ['tunel']
        command: 'tunnel --no-autoupdate run'
        environment:
            TUNNEL_TOKEN: '${CLOUDFLARE_TUNNEL_TOKEN}'
            # Por TCP y no por QUIC.
            #
            # cloudflared habla con Cloudflare por QUIC (UDP/7844) si puede, y
            # en esta red la conexion se caia sola: «timeout: no recent network
            # activity» cincuenta veces en tres dias, subiendo a dieciocho en
            # una sola hora. El UDP en una red universitaria se limita o se
            # descarta cuando hay trafico, y una conexion QUIC muerta no avisa:
            # deja de contestar y el sitio se cae hasta que reconecta.
            #
            # http2 usa TCP/7844, que atraviesa cortafuegos y aguanta
            # congestion. Va un poco mas lento por conexion; a cambio no se
            # cae, que es lo que se estaba pidiendo.
            TUNNEL_TRANSPORT_PROTOCOL: 'http2'
        restart: unless-stopped
        networks:
            - sail
        depends_on:
            - laravel.test
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
