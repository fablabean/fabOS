; La piscina de procesos PHP que atiende a nginx.
;
; Sustituye a `php artisan serve`, que atendía con un proceso por petición y se
; atragantaba con cuerpos grandes.

[www]
user = sail
group = sail

; Socket de dominio Unix y no TCP: nginx y PHP viven en el mismo contenedor, y
; el socket evita dar una vuelta por la pila de red en cada petición.
listen = /run/php/php8.5-fpm.sock
listen.owner = sail
listen.group = sail
listen.mode = 0660

; `dynamic` y no `ondemand`: el laboratorio tiene ráfagas —treinta personas
; entrando a la vez al empezar una clase— y arrancar procesos en ese momento
; añade latencia justo cuando peor viene.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Reciclar procesos acota cualquier fuga de memoria lenta: ninguno vive para
; siempre.
pm.max_requests = 500

; Las peticiones que tarden más de esto quedan anotadas con su traza. Sin esto,
; una consulta lenta solo se nota porque «el sistema va raro».
slowlog = /dev/stderr
request_slowlog_timeout = 10s

; Coherente con el fastcgi_read_timeout de nginx.
request_terminate_timeout = 300s

catch_workers_output = yes
decorate_workers_output = no

; Los límites de subida viven aquí, no en el php.ini de la CLI: quien atiende
; las peticiones web es este proceso.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300
