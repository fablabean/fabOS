; nginx y php-fpm, en lugar de `php artisan serve`.
;
; Los dos son necesarios y ninguno vale sin el otro, así que supervisor levanta
; ambos y reinicia el que se caiga. `autorestart=true` importa: un proceso
; muerto sin reiniciar deja el laboratorio sin sistema hasta que alguien mire.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 --nodaemonize --fpm-config /etc/php/8.5/fpm/php-fpm.conf
user=root
autostart=true
autorestart=true
; Antes que nginx: si nginx arranca primero, las primeras peticiones se
; encuentran el socket sin nadie al otro lado.
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
