# nginx delante de php-fpm, en lugar de `php artisan serve`.
#
# El servidor de desarrollo de PHP tardaba entre cinco y nueve segundos en
# recibir una foto de tres megas —unos 500 KB/s— y por el túnel esa lentitud se
# convertía a veces en un 502 sin explicación. nginx lee el cuerpo de la
# petición a velocidad de disco y solo entrega a PHP cuando está completo.

user sail;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Lo que rompía las subidas. Generoso a propósito: el formulario ya encoge
    # las fotos en el navegador, y esto es el techo de lo que puede llegar por
    # cualquier otra vía —un contrato en PDF, un CSV de importación—.
    # Por encima del tope de la aplicacion (90 MB) y por debajo del
    # limite del tunel (100 MB): el "no" tiene que darlo el validador,
    # con su mensaje, no un 413 sin explicacion.
    client_max_body_size 96m;

    # Cuerpos de hasta 1 MB se manejan en memoria; el resto va a disco sin
    # bloquear a PHP mientras llega.
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Livewire sirve su javascript desde una RUTA, no desde un fichero, y
        # esa ruta termina en «.js». Sin esta excepcion cae en el bloque de
        # estaticos de abajo, nginx lo busca en el disco, no lo encuentra y
        # devuelve 404 sin despertar a PHP: el panel carga sin javascript y se
        # ve en negro, sin un solo error en el registro de Laravel, porque
        # Laravel nunca llego a enterarse de la peticion.
        location ~ ^/livewire(-[0-9a-z]+)?/ {
            try_files $uri /index.php?$query_string;
        }

        # Los estáticos los sirve nginx directamente, sin despertar a PHP.
        location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|map)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            # Una importación grande o un informe pesado tardan más que el
            # minuto por defecto, y cortar a mitad deja el trabajo sin acabar
            # y sin explicación.
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Nada de servir lo que no es público.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
