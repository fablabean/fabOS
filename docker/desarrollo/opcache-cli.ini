; OPcache para la consola, en desarrollo (pruebas y artisan).
;
; La extension venia cargada pero apagada para CLI, que es el valor por defecto
; de PHP y tiene sentido para un script corto: compilar y guardar en memoria no
; se amortiza si el proceso vive medio segundo.
;
; Aqui no es un script corto: son 1710 pruebas, y cada una arranca Laravel y
; Filament enteros. Sin esto, PHP vuelve a leer y compilar varios miles de
; ficheros por prueba, y encima esos ficheros viven en un bind mount de Windows
; -donde cada `stat` cuesta bastante mas de lo que costaria en Linux-.
;
; Solo para desarrollo. La imagen de produccion no monta esto: alli lo que corre
; es php-fpm, que ya tiene su propia configuracion.
opcache.enable_cli=1

; 256 MB: el codigo de la aplicacion mas Laravel, Filament y Livewire no cabe
; comodo en los 128 de fabrica, y un cache que se llena deja de servir.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16

; Filament y Laravel juntos pasan de largo los 10.000 de fabrica.
opcache.max_accelerated_files=30000

; Se comprueba si el fichero cambio, SIEMPRE.
;
; Apagarlo seria mas rapido todavia, y es justo lo que no se puede hacer aqui:
; este contenedor es donde se programa. Un cache que no revalida significa
; editar un fichero, recargar y seguir viendo el codigo de antes — media hora
; buscando un fallo que ya estaba arreglado.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
