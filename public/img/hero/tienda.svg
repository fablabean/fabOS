<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!--
    Tienda e insumos. Rollos y láminas en el estante: lo que se consume, se
    repone y se vende. La existencia se mueve solo con movimientos registrados.
  -->
  <defs>
    <linearGradient id="fondoT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221c14"/>
      <stop offset="1" stop-color="#12100c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fondoT)"/>

  <!-- Estantería. -->
  <g stroke="#DFA163" stroke-width="2" opacity=".18">
    <path d="M880 320 H1560 M880 560 H1560 M880 780 H1560"/>
    <path d="M900 300 V800 M1540 300 V800"/>
  </g>

  <!-- Rollos de filamento. -->
  <g opacity=".5">
    <g fill="none" stroke="#5CC9B8" stroke-width="14" opacity=".45">
      <circle cx="1000" cy="250" r="52"/>
      <circle cx="1140" cy="250" r="52"/>
      <circle cx="1280" cy="250" r="52"/>
    </g>
    <g fill="#12100c">
      <circle cx="1000" cy="250" r="16"/>
      <circle cx="1140" cy="250" r="16"/>
      <circle cx="1280" cy="250" r="16"/>
    </g>
  </g>

  <!-- Láminas apiladas. -->
  <g opacity=".38">
    <rect x="960"  y="452" width="420" height="18" rx="4" fill="#DFA163" opacity=".5"/>
    <rect x="975"  y="478" width="390" height="18" rx="4" fill="#DFA163" opacity=".42"/>
    <rect x="990"  y="504" width="360" height="18" rx="4" fill="#DFA163" opacity=".34"/>
    <rect x="1005" y="530" width="330" height="18" rx="4" fill="#DFA163" opacity=".26"/>
  </g>

  <!-- Cajas del último nivel. -->
  <g opacity=".22" fill="none" stroke="#5CC9B8" stroke-width="2">
    <rect x="960"  y="660" width="120" height="110" rx="6"/>
    <rect x="1110" y="660" width="120" height="110" rx="6"/>
    <rect x="1260" y="660" width="120" height="110" rx="6"/>
    <path d="M960 700 H1080 M1110 700 H1230 M1260 700 H1380"/>
  </g>
</svg>
