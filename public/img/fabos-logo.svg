<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="fabOS">
  <!--
    Marca provisional de fabOS.

    Tres capas que se van apilando dentro de un contenedor: es lo que hace un
    laboratorio de fabricación digital —construir por capas— y funciona igual
    en 24 px que en un cartel. Usa currentColor para el contorno, así se adapta
    al tema claro y al oscuro sin dos versiones del archivo.

    Para poner el logo real del laboratorio: reemplaza este archivo, o apunta
    LAB_LOGO en .env a otra ruta.
  -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="7" stroke="currentColor" stroke-width="2"/>
  <rect x="9" y="20" width="14" height="3.2" rx="1.6" fill="currentColor" opacity=".35"/>
  <rect x="9" y="14.4" width="14" height="3.2" rx="1.6" fill="currentColor" opacity=".6"/>
  <rect x="9" y="8.8" width="9" height="3.2" rx="1.6" fill="currentColor"/>
</svg>
